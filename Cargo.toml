[workspace]
members = ["crates/llvm-dev-core", "crates/llvm-dev-cli"]
resolver = "2"

[workspace.package]
version = "0.2.3"
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

[profile.release]
opt-level = 2
